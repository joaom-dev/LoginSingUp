spring:
  application:
    name: LoginSingUp
  datasource:
    url: jdbc:mysql://localhost:3306/juao_authentication?createDatabaseIfNotExist=true
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8082
