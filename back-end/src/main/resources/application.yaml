spring:
  application:
    name: LoginSingUp
  datasource:
    url: ${URL_DB}
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  expiration: ${JWT_EXPIRATION}
  key: ${JWT_KEY}

logging:
  level:
    LoginSingUp: DEBUG
    org.springframework.security: DEBUG